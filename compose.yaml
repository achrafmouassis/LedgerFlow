services:
  backend:
    profiles: [app]
    build: ./ledgerflow-backend
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/ledgerflow
      DB_USERNAME: ledgerflow
      DB_PASSWORD: ledgerflow_dev
      LEDGERFLOW_ADMIN_PASSWORD: ${LEDGERFLOW_ADMIN_PASSWORD:-}
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
  postgres:
    image: postgres:18
    container_name: ledgerflow-postgres
    environment:
      POSTGRES_DB: ledgerflow
      POSTGRES_USER: ledgerflow
      POSTGRES_PASSWORD: ledgerflow_dev
    ports:
      - "5432:5432"
    volumes:
      - ledgerflow-postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ledgerflow -d ledgerflow"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

volumes:
  ledgerflow-postgres-data:
