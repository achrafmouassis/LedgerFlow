apiVersion: 1
contactPoints:
  - orgId: 1
    name: ledgerflow-email
    receivers:
      - uid: ledgerflow-email
        type: email
        settings:
          addresses: $ALERT_EMAIL_TO
          singleEmail: true
policies:
  - orgId: 1
    receiver: ledgerflow-email
    group_by: [grafana_folder, alertname]
    group_wait: 30s
    group_interval: 5m
    repeat_interval: 24h
groups:
  - orgId: 1
    name: ledgerflow-heartbeat
    folder: LedgerFlow
    interval: 30s
    rules:
      - uid: ledgerflow-monitor-stale
        title: Surveillance LedgerFlow interrompue
        condition: C
        for: 1m
        noDataState: Alerting
        execErrState: Alerting
        annotations:
          summary: Le moniteur ne publie plus de mesure depuis plus de 90 secondes.
        data:
          - refId: A
            relativeTimeRange: {from: 300, to: 0}
            datasourceUid: ledgerflow-postgres
            model:
              refId: A
              rawQuery: true
              editorMode: code
              format: time_series
              rawSql: "SELECT now() AS time,COALESCE(EXTRACT(EPOCH FROM now()-MAX(sampled_at)),86400)::double precision AS value FROM analytics.monitor_samples"
          - refId: B
            datasourceUid: __expr__
            relativeTimeRange: {from: 0, to: 0}
            model:
              refId: B
              type: reduce
              expression: A
              reducer: last
              settings: {mode: dropNN}
          - refId: C
            datasourceUid: __expr__
            relativeTimeRange: {from: 0, to: 0}
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator: {type: gt, params: [90]}
                  operator: {type: and}
                  reducer: {type: last, params: []}
                  type: query
                  query: {params: [C]}
