events {}
http {
  upstream api { server backend:8080; }
  server {
    listen 8080;
    location / {
      proxy_pass http://api;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_read_timeout 35s;
      add_header X-QA-Upstream $upstream_addr always;
    }
  }
}
