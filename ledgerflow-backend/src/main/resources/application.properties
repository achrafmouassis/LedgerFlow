spring.application.name=ledgerflow-backend

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/ledgerflow}
spring.datasource.username=${DB_USERNAME:ledgerflow}
spring.datasource.password=${DB_PASSWORD:ledgerflow_dev}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.datasource.hikari.connection-timeout=5000
spring.datasource.hikari.validation-timeout=2000

management.endpoints.web.exposure.include=health,info

# Banking always captures events; transport/consumer are optional for local development.
ledgerflow.pipeline.enabled=${PIPELINE_ENABLED:false}
ledgerflow.pipeline.publisher-scheduling-enabled=true
ledgerflow.pipeline.poll-delay-ms=1000
ledgerflow.pipeline.topic=ledgerflow.operations.v1
ledgerflow.pipeline.consumer-group=ledgerflow-analytics-v1
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.admin.operation-timeout=5s
