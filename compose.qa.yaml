# Independent project: never combine with the application's Compose files.
services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: ledgerflow_qa
      POSTGRES_USER: ledgerflow
      POSTGRES_PASSWORD: qa_local_only
    volumes:
      # New volume after the initial QA initialization was interrupted by a full disk.
      # The original ledgerflow-qa_qa-postgres volume is retained for diagnosis.
      - qa-postgres-recovered:/var/lib/postgresql
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U ledgerflow -d ledgerflow_qa"]
      interval: 3s
      timeout: 10s
      retries: 30
  kafka:
    image: apache/kafka:4.1.2
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_LISTENERS: CONTROLLER://:29093,PLAINTEXT://:19092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:19092
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      CLUSTER_ID: Qa6g3nShT-eMCtK--X86sw
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_NUM_PARTITIONS: 3
    healthcheck:
      test: [CMD-SHELL, "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:19092 --list >/dev/null 2>&1"]
      interval: 15s
      timeout: 30s
      retries: 30
  backend:
    build: ./ledgerflow-backend
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/ledgerflow_qa
      DB_USERNAME: ledgerflow
      DB_PASSWORD: qa_local_only
      PIPELINE_ENABLED: "true"
      KAFKA_BOOTSTRAP_SERVERS: kafka:19092
      LEDGERFLOW_ADMIN_PASSWORD: qa-only-admin-password-change-me
      JAVA_TOOL_OPTIONS: -Xms128m -Xmx384m
    ports: ["127.0.0.1:18080:8080"]
    depends_on:
      postgres: {condition: service_healthy}
      kafka: {condition: service_healthy}
    healthcheck:
      test: [CMD-SHELL, "curl -fsS http://localhost:8080/actuator/health >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 30s
  qa:
    build: ./data-pipeline
    profiles: [tools]
    user: "0:0"
    entrypoint: [python3, /qa/run.py]
    environment:
      QA_ISOLATED: "1"
      PGHOST: postgres
      PGDATABASE: ledgerflow_qa
      PGUSER: ledgerflow
      PGPASSWORD: qa_local_only
      SPARK_MASTER: local[2]
      QA_USERNAME: admin
      QA_PASSWORD: qa-only-admin-password-change-me
    volumes:
      - ./qa:/qa:ro
      - ./.work/qa:/reports
      - ./.work/qa-private:/private
  interrupted-batch:
    profiles: [tools]
    build: ./data-pipeline
    environment:
      PGHOST: postgres
      PGDATABASE: ledgerflow_qa
      PGUSER: ledgerflow
      PGPASSWORD: qa_local_only
      SPARK_MASTER: local[2]
volumes:
  qa-postgres-recovered:
