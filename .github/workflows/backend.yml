name: Backend verification
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ledgerflow-backend
    services:
      kafka:
        image: apache/kafka:4.1.2
        ports:
          - 9092:9092
        options: >-
          --health-cmd "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: ledgerflow_test
          POSTGRES_USER: ledgerflow
          POSTGRES_PASSWORD: test_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ledgerflow -d ledgerflow_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Allow Maven wrapper execution
        run: chmod +x mvnw
      - name: H2 tests
        run: ./mvnw --batch-mode test
      - name: PostgreSQL and real Kafka tests, then package
        run: ./mvnw --batch-mode verify
        env:
          TEST_DB_URL: jdbc:postgresql://localhost:5432/ledgerflow_test
          TEST_DB_USERNAME: ledgerflow
          TEST_DB_PASSWORD: test_only
          TEST_KAFKA_BOOTSTRAP: localhost:9092

  batch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: ledgerflow_batch_test
          POSTGRES_USER: ledgerflow
          POSTGRES_PASSWORD: test_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ledgerflow -d ledgerflow_batch_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15
    steps:
      - uses: actions/checkout@v4
      - name: Build PySpark batch image
        run: docker build -t ledgerflow-batch-test data-pipeline
      - name: Spark unit and PostgreSQL integration tests
        run: >-
          docker run --rm --network host --entrypoint python3
          --mount "type=bind,source=${{ github.workspace }}/ledgerflow-backend/src/main/resources/db/migration,target=/migrations,readonly"
          -e BATCH_INTEGRATION=1 -e PGHOST=127.0.0.1
          -e PGDATABASE=ledgerflow_batch_test -e PGUSER=ledgerflow -e PGPASSWORD=test_only
          ledgerflow-batch-test -m pytest -q -p no:cacheprovider

  operations:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: ledgerflow_ops_test
          POSTGRES_USER: ledgerflow
          POSTGRES_PASSWORD: test_only
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U ledgerflow -d ledgerflow_ops_test"
          --health-interval 5s --health-timeout 5s --health-retries 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r data-pipeline/requirements.txt
      - name: Operational recovery and notification tests
        run: python -m pytest data-pipeline/ops_tests -q
        env:
          PYTHONPATH: data-pipeline
          OPS_INTEGRATION: '1'
          PGHOST: localhost
          PGDATABASE: ledgerflow_ops_test
          PGUSER: ledgerflow
          PGPASSWORD: test_only
      - name: Validate complete Compose configuration
        run: docker compose -f compose.yaml -f compose.pipeline.yaml -f compose.batch.yaml -f compose.ops.yaml --profile app config --quiet
      - name: Validate isolated QA configuration and runner safety
        run: |
          docker compose -p ledgerflow-qa -f compose.qa.yaml config --quiet
          docker compose -p ledgerflow-qa -f compose.qa.yaml -f compose.qa-scale.yaml config --quiet
          PYTHONPATH=data-pipeline python -m unittest discover -s qa -p 'test_*.py'
      - name: Validate native Power BI report schemas
        run: |
          pip install -r bi/powerbi/requirements-validation.txt
          python scripts/check_powerbi.py --fetch-schemas

  qa-end-to-end:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Start isolated QA platform
        run: docker compose -p ledgerflow-qa -f compose.qa.yaml up -d --build --wait --wait-timeout 300 postgres kafka backend
      - name: Build generator
        run: docker compose -p ledgerflow-qa -f compose.qa.yaml build qa
      - name: Banking, load, pipeline and Spark reconciliation
        run: docker compose -p ledgerflow-qa -f compose.qa.yaml run --rm --no-deps qa --operations 30 --concurrency 1,4 --p95-ms 5000
      - name: Upload synthetic QA reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ledgerflow-qa-reports
          path: .work/qa/
          include-hidden-files: true
          if-no-files-found: warn
      - name: QA logs
        if: failure()
        run: docker compose -p ledgerflow-qa -f compose.qa.yaml logs --tail 150 backend kafka
      - name: Stop isolated QA platform
        if: always()
        run: docker compose -p ledgerflow-qa -f compose.qa.yaml stop
